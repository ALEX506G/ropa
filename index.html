<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--azul:#0b3d6e;--azul2:#1f6fb2;--hielo:#eaf3fb;--txt:#14212e;--gris:#5b6b7a;--borde:#d6e2ee;--ok:#15803d;--err:#b42318;--bg:#f4f8fc}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:16px}
  header{background:#fff;border-bottom:4px solid var(--azul2);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  header img{height:52px;width:auto;display:block}
  header .tit{text-align:right;color:var(--azul)}
  header h1{font-size:17px;margin:0;line-height:1.2}
  header small{color:var(--gris);font-size:12px}
  main{max-width:640px;margin:0 auto;padding:16px 16px 120px}
  .card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:16px;margin-bottom:12px}
  label{display:block;font-weight:600;margin:12px 0 6px}
  select,input,textarea{width:100%;font-size:17px;padding:12px;border:1px solid var(--borde);border-radius:10px;background:#fff;color:var(--txt);font-family:inherit}
  textarea{min-height:70px;resize:vertical}
  button{font-family:inherit;cursor:pointer}
  .btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--azul2);color:#fff;font-size:17px;font-weight:700;margin-top:16px}
  .btn:disabled{opacity:.5}
  .btn.sec{background:#fff;color:var(--azul);border:1px solid var(--azul2)}
  .err{color:var(--err);font-weight:600;margin-top:10px;min-height:1em}
  .hola{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .hola b{font-size:18px}
  .link{background:none;border:0;color:var(--azul2);text-decoration:underline;font-size:15px;padding:4px}
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tabs button{flex:1;padding:11px;border:1px solid var(--borde);background:#fff;border-radius:10px;font-size:15px;font-weight:600;color:var(--gris)}
  .tabs button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
  .art{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--borde);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .color{flex-basis:100%;display:flex;align-items:center;gap:8px}
  .color span{font-size:14px;font-weight:600;color:var(--azul);white-space:nowrap}
  .color select{padding:9px 10px;font-size:15px}
  .color select.falta{border:2px solid var(--err)}
  .talla.elige{background:#b45309}
  .art.sel{border-color:var(--azul2);background:var(--hielo)}
  .art h3{margin:0 0 3px;font-size:16px}
  .talla{display:inline-block;background:var(--azul);color:#fff;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:700}
  .ult{font-size:13px;color:var(--gris);margin-top:4px}
  .step{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .step button{width:40px;height:40px;border-radius:50%;border:1px solid var(--azul2);background:#fff;color:var(--azul2);font-size:22px;font-weight:700;line-height:1}
  .step span{min-width:24px;text-align:center;font-size:18px;font-weight:700}
  .barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--borde);padding:12px 16px}
  .barra div{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .barra .btn{margin:0;flex:1}
  .barra small{color:var(--gris);white-space:nowrap}
  .hist{border-bottom:1px solid var(--borde);padding:10px 0;display:flex;justify-content:space-between;gap:10px}
  .hist:last-child{border:0}
  .hist .d{font-size:13px;color:var(--gris)}
  .est{font-size:12px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap;align-self:center}
  .PENDIENTE{background:#fff4cc;color:#7a5b00}.PEDIDOALPROVEEDOR{background:#dbeafe;color:#1e40af}.ENTREGADO{background:#dcfce7;color:#166534}.ANULADO{background:#eee;color:#555}
  .modal{position:fixed;inset:0;background:rgba(10,25,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .modal .card{width:100%;max-width:640px;margin:0;border-radius:16px 16px 0 0;max-height:85vh;overflow:auto}
  .res{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--borde)}
  .okbox{text-align:center;padding:24px 16px}
  .okbox .tick{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:36px;line-height:64px;margin:0 auto 12px}
  .vacio{color:var(--gris);text-align:center;padding:20px}
  .hidden{display:none!important}
  .cargando{position:fixed;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;z-index:20;font-weight:700;color:var(--azul)}
</style>
</head>

  var S = { nombre: '', pin: '', datos: null, cant: {}, color: {}, talla: {} };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function mostrar(id, si) { $(id).classList.toggle('hidden', !si); }
  function cargando(si) { mostrar('cargando', si); }
  function mensajeError(e) { return (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, ''); }
  function llamar(fn, args, ok, ko) {
    cargando(true);
    var r = google.script.run
      .withSuccessHandler(function (x) { cargando(false); ok(x); })
      .withFailureHandler(function (e) { cargando(false); ko(mensajeError(e)); });
    r[fn].apply(r, args);
  }

  /* ---------- Acceso ---------- */
  function cargarNombres() {
    llamar('getEmpleados', [], function (nombres) {
      var sel = $('selNombre');
      sel.innerHTML = '<option value="">— Elige tu nombre —</option>' +
        nombres.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('') +
        '<option value="__ADMIN__">— ADMINISTRACIÓN —</option>';
      try { var g = localStorage.getItem('ropaReme_nombre'); if (g && nombres.indexOf(g) >= 0) sel.value = g; } catch (e) {}
      sel.onchange && sel.onchange();
    }, function (m) { $('errLogin').textContent = m; });
  }

  function entrar() {
    var n = $('selNombre').value, p = $('inPin').value.trim();
    $('errLogin').textContent = '';
    if (!n) { $('errLogin').textContent = 'Elige tu nombre.'; return; }
    if (!p) { $('errLogin').textContent = 'Escribe tu PIN.'; return; }
    if (n === '__ADMIN__') {
      llamar('adminAcceso', [p], function (url) {
        $('inPin').value = '';
        var tk = (String(url).match(/[?&]t=([0-9a-f-]{36})/) || [])[1];
        $('aPanel').href = window.API_URL ? 'admin.html?t=' + tk : url;
        mostrar('vLogin', false); mostrar('vAdmin', true);
      }, function (m) { $('errLogin').textContent = m; });
      return;
    }
    llamar('login', [n, p], function (d) {
      S.nombre = n; S.pin = p;
      try { localStorage.setItem('ropaReme_nombre', n); } catch (e) {}
      abrirApp(d);
    }, function (m) { $('errLogin').textContent = m; });
  }

  function salir() {
    S = { nombre: '', pin: '', datos: null, cant: {}, color: {}, talla: {} };
    $('inPin').value = '';
    mostrar('vApp', false); mostrar('vOk', false); mostrar('barra', false); mostrar('vLogin', true);
  }

  /* ---------- App ---------- */
  function abrirApp(d) {
    S.datos = d; S.cant = {}; S.color = {}; S.talla = {};
    $('txtNombre').textContent = d.nombre;
    $('inObs').value = ''; $('errPedir').textContent = '';
    pintarArticulos(); pintarHistorial();
    mostrar('vLogin', false); mostrar('vOk', false); mostrar('vApp', true);
    tab('pedir');
  }

  function textoUltimo(a) {
    if (!a.ultimo) return 'Nunca lo has pedido';
    var d = a.dias === 0 ? 'hoy' : a.dias === 1 ? 'hace 1 día' : 'hace ' + a.dias + ' días';
    return 'Último pedido: ' + a.ultimo + ' (' + d + ')';
  }

  function pintarArticulos() {
    var arts = S.datos.articulos;
    if (!arts.length) { $('listaArt').innerHTML = '<div class="card vacio">Aún no tienes artículos asignados.<br>Avisa a la oficina.</div>'; return; }
    $('listaArt').innerHTML = arts.map(function (a, i) {
      var c = S.cant[a.articulo] || 0;
      return '<div class="art' + (c ? ' sel' : '') + '">' +
        '<div><h3>' + esc(a.articulo) + '</h3>' +
        (a.elegir ? '<span class="talla elige">' + (S.talla[a.articulo] ? 'Talla ' + esc(S.talla[a.articulo]) : 'Elige tu talla') + '</span>'
                  : '<span class="talla">Talla ' + esc(a.talla) + '</span>') +
        '<div class="ult">' + esc(textoUltimo(a)) + '</div></div>' +
        '<div class="step"><button data-i="' + i + '" data-d="-1" aria-label="Quitar">−</button>' +
        '<span>' + c + '</span><button data-i="' + i + '" data-d="1" aria-label="Añadir">+</button></div>' +
        (c && a.elegir ? '<label class="color"><span>Tu talla:</span><select data-t="' + i + '"' + (S.talla[a.articulo] ? '' : ' class="falta"') + '>' +
          '<option value="">— Elige tu talla —</option>' +
          a.tallas.map(function (t) { return '<option' + (S.talla[a.articulo] === t ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') +
          '</select></label>' : '') +
        (c && a.colores && a.colores.length ? '<label class="color"><span>Color:</span><select data-c="' + i + '">' +
          '<option value="">Me da igual</option>' +
          a.colores.map(function (col) { return '<option' + (S.color[a.articulo] === col ? ' selected' : '') + '>' + esc(col) + '</option>'; }).join('') +
          '</select></label>' : '') +
        '</div>';
    }).join('');
    actualizarBarra();
  }

  function cambiar(i, d) {
    var a = S.datos.articulos[i];
    var c = (S.cant[a.articulo] || 0) + d;
    c = Math.max(0, Math.min(S.datos.maxCantidad || 10, c));
    if (c) S.cant[a.articulo] = c; else { delete S.cant[a.articulo]; delete S.color[a.articulo]; delete S.talla[a.articulo]; }
    pintarArticulos();
  }

  function lineas() {
    return S.datos.articulos.filter(function (a) { return S.cant[a.articulo]; })
      .map(function (a) { return { articulo: a.articulo, talla: a.elegir ? (S.talla[a.articulo] || '') : a.talla, elegir: !!a.elegir, color: S.color[a.articulo] || '', conColor: !!(a.colores && a.colores.length), cantidad: S.cant[a.articulo] }; });
  }

  function actualizarBarra() {
    var t = lineas().reduce(function (s, l) { return s + l.cantidad; }, 0);
    $('txtTotal').textContent = t + (t === 1 ? ' prenda' : ' prendas');
    $('bRevisar').disabled = !t;
  }

  function pintarHistorial() {
    var h = S.datos.historial;
    if (!h.length) { $('listaHist').innerHTML = '<div class="vacio">Todavía no has hecho ninguna petición.</div>'; return; }
    $('listaHist').innerHTML = h.map(function (r) {
      return '<div class="hist"><div><b>' + r.cantidad + ' × ' + esc(r.articulo) + '</b> · talla ' + esc(r.talla) + (r.color ? ' · ' + esc(r.color) : '') +
        '<div class="d">' + esc(r.fecha) + ' · ' + esc(r.pet) + (r.entrega ? ' · entregado ' + esc(r.entrega) : '') + '</div></div>' +
        '<span class="est ' + esc(r.estado.replace(/\s/g, '')) + '">' + esc(r.estado) + '</span></div>';
    }).join('');
  }

  function tab(t) {
    var p = t === 'pedir';
    $('tPedir').classList.toggle('on', p); $('tHist').classList.toggle('on', !p);
    mostrar('pPedir', p); mostrar('pHist', !p); mostrar('barra', p && S.datos.articulos.length > 0);
  }

  function revisar() {
    var ls = lineas();
    if (!ls.length) return;
    var sinTalla = ls.filter(function (l) { return !l.talla; });
    if (sinTalla.length) {
      $('errPedir').textContent = 'Elige tu talla de: ' + sinTalla.map(function (l) { return l.articulo; }).join(', ');
      pintarArticulos();
      return;
    }
    $('errPedir').textContent = '';
    $('resumen').innerHTML = ls.map(function (l) {
      return '<div class="res"><span><b>' + esc(l.articulo) + '</b> · talla ' + esc(l.talla) + (l.conColor ? ' · color: ' + (l.color ? esc(l.color) : 'me da igual') : '') + '</span><b>' + l.cantidad + '</b></div>';
    }).join('');
    var o = $('inObs').value.trim();
    $('resObs').textContent = o ? 'Observaciones: ' + o : '';
    mostrar('modal', true);
  }

  function confirmar() {
    var ls = lineas().map(function (l) { return { articulo: l.articulo, cantidad: l.cantidad, color: l.color, talla: l.elegir ? l.talla : '' }; });
    $('bConfirmar').disabled = true;
    llamar('enviarPedido', [S.nombre, S.pin, ls, $('inObs').value], function (r) {
      $('bConfirmar').disabled = false;
      mostrar('modal', false);
      S.datos = r.datos; S.cant = {}; S.color = {}; S.talla = {};
      $('txtOk').textContent = 'Nº ' + r.idPet + ' · ' + r.fecha + '. La oficina ya la tiene registrada.';
      mostrar('vApp', false); mostrar('barra', false); mostrar('vOk', true);
      window.scrollTo(0, 0);
    }, function (m) {
      $('bConfirmar').disabled = false;
      mostrar('modal', false);
      $('errPedir').textContent = m;
    });
  }

  /* ---------- Eventos ---------- */
  $('bEntrar').onclick = entrar;
  $('inPin').addEventListener('keydown', function (e) { if (e.key === 'Enter') entrar(); });
  $('bSalir').onclick = salir;
  $('bVolverAdm').onclick = function () { mostrar('vAdmin', false); mostrar('vLogin', true); };
  $('selNombre').onchange = function () {
    var adm = $('selNombre').value === '__ADMIN__';
    document.querySelector('label[for="inPin"]').textContent = adm ? 'PIN de administrador' : 'PIN';
  };
  $('tPedir').onclick = function () { tab('pedir'); };
  $('tHist').onclick = function () { tab('hist'); };
  $('listaArt').onclick = function (e) {
    var b = e.target.closest('button[data-i]');
    if (b) cambiar(Number(b.getAttribute('data-i')), Number(b.getAttribute('data-d')));
  };
  $('listaArt').onchange = function (e) {
    var st = e.target.closest('select[data-t]');
    if (st) {
      var at = S.datos.articulos[Number(st.getAttribute('data-t'))];
      if (st.value) S.talla[at.articulo] = st.value; else delete S.talla[at.articulo];
      pintarArticulos();
      return;
    }
    var sel = e.target.closest('select[data-c]');
    if (!sel) return;
    var a = S.datos.articulos[Number(sel.getAttribute('data-c'))];
    if (sel.value) S.color[a.articulo] = sel.value; else delete S.color[a.articulo];
  };
  $('bRevisar').onclick = revisar;
  $('bCorregir').onclick = function () { mostrar('modal', false); };
  $('bConfirmar').onclick = confirmar;
  $('bOtra').onclick = function () { abrirApp(S.datos); };

  cargarNombres();
</script>
</body>
</html>
